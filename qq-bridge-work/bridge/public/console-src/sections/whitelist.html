<section id="section-whitelist" data-page="access" class="card span-all">
      <h2>白名单 / 管理员</h2>
      <label>允许的群号（逗号分隔）</label>
      <input type="text" id="wlGroups" placeholder="123456789, 123456">
      <label>允许的私聊 QQ（逗号分隔）</label>
      <input type="text" id="wlPrivate" placeholder="123456789">
      <label>管理员 QQ（ownerQQ，最高权限）</label>
      <input type="text" id="ownerQQ" placeholder="123456789">
      <div class="meta">管理员是唯一可执行管理命令/审批/closed-agent 的 QQ；可留空清除（清除后无管理员，fail-closed）。</div>
      <label>拒绝的群号（黑名单，逗号分隔）</label>
      <input type="text" id="dnGroups" placeholder="">
      <label>拒绝的私聊 QQ（黑名单，逗号分隔）</label>
      <input type="text" id="dnPrivate" placeholder="">
      <div class="row" style="margin-top:10px">
        <button id="wlSave">保存白名单</button>
        <span class="meta">保存后立即生效并写入 config.json</span>
      </div>
    </section>
