<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>QQ 手动登录验证</title><link rel="stylesheet" href="/page.css"><link rel="stylesheet" href="/whale-ui.css"><script src="/page.js" defer></script>
</head>
<body>
  <main>
    <div class="companion-avatar" aria-hidden="true"><img src="/character.png" alt=""></div>
    <p class="eyebrow">DeepSeek · QQ 接入研究</p>
    <h1>手动登录验证</h1>
    <p>点击开始后，用手机 QQ 扫码，并在手机上确认登录。</p>
    <section class="panel" aria-labelledby="status-title">
      <h2 id="status-title">当前状态</h2>
      <p id="status" role="status" aria-live="polite">尚未开始</p>
      <div class="qr-frame"><img id="qr" alt="使用手机 QQ 扫描此登录二维码" width="256" height="256" hidden><p id="placeholder">二维码会显示在这里</p></div>
      <div class="actions"><button id="start">开始扫码登录</button><button id="refresh" hidden>重新获取二维码</button><button id="stop" class="secondary">停止试验</button></div>
      <p id="error" role="alert"></p>
    </section>
    <p class="note">二维码仅在本机页面显示，请勿分享。试验最长 5 分钟，登录成功后自动结束；本轮仅确认登录状态，不接入聊天。</p>
  </main>
</body>
</html>
